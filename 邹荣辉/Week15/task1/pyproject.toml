[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multimodal-rag-chatbot"
version = "0.1.0"
description = "Multimodal RAG over image-rich PDFs with MinerU + Chinese-CLIP + BGE + Qwen-VL"
requires-python = ">=3.10,<3.13"
readme = "README.md"

dependencies = [
    # Web
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "python-multipart==0.0.12",
    "sse-starlette==2.1.3",
    "pydantic==2.9.2",
    "pydantic-settings==2.5.2",
    "streamlit>=1.35,<2.0",
    "httpx==0.27.2",

    # Storage / MQ
    "sqlalchemy==2.0.35",
    "pymilvus==2.4.7",
    "confluent-kafka==2.5.3",

    # Retrieval
    "rank-bm25==0.2.2",
    "jieba==0.42.1",
    "numpy==1.26.4",

    # Models (Qwen2-VL 需要 transformers>=4.45)
    "torch==2.4.1",
    "transformers==4.45.2",
    "sentence-transformers==3.1.1",
    "accelerate==0.34.2",
    "pillow==10.4.0",
    "qwen-vl-utils==0.0.8",

    # Utilities
    "python-dotenv==1.0.1",
    "loguru==0.7.2",
    "tenacity==9.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "httpx==0.27.2",
    "ruff==0.6.9",
]

# MinerU 不在此处声明，按官方文档单独安装：
#   pip install magic-pdf[full] --extra-index-url https://wheels.myhloli.com
# 安装后通过 MINERU_MODEL_PATH 指定本地权重目录。

[tool.setuptools.packages.find]
where = ["."]
include = ["libs*", "services*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
